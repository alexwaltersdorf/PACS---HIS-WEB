name: Validate planner
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 observed 2026-11-18
        with:
          persist-credentials: false
      - name: Install documentation validator
        run: python -m pip install -r requirements-dev.txt
      - name: Validate planner contracts and references
        run: python scripts/validate_planner.py
      - name: Test council message exchange
        run: python -m unittest discover -s tests
