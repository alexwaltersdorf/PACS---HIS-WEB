worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server_tokens off;
  resolver 127.0.0.11 valid=10s ipv6=off;
  map $http_origin $foreign_origin {
    default 1;
    "" 0;
    "http://127.0.0.1:8042" 0;
    "http://localhost:8042" 0;
  }
  server { listen 8080 default_server; server_name _; return 444; }
  server {
    listen 8080;
    server_name 127.0.0.1 localhost;
    if ($foreign_origin) { return 403; }
    client_max_body_size 0;
    add_header Content-Security-Policy "default-src 'self' blob: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    location = /local-health { return 200 'ok'; }
    location / {
      set $archive http://orthanc:8042;
      proxy_pass $archive;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Accept-Encoding "";
      sub_filter '<html' '<html translate="no"';
      sub_filter '<head>' '<head><meta name="google" content="notranslate">';
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Credentials;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }
  }
}
